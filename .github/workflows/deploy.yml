name: Build & deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        # A project site is served from /<repo>/, so the bundler has to know its
        # sub-path or every asset request resolves to the domain root and 404s.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Add SPA fallback
        # Filters live in the query string so deep paths are rare, but a direct
        # hit on an unknown path should still hand the URL to the app rather
        # than showing GitHub's 404 page.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
